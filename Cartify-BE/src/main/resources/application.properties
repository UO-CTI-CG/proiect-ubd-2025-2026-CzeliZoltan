spring.application.name=Cartify

spring.datasource.url=jdbc:mysql://localhost:3306/cartify_db?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
